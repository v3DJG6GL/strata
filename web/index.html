<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0d1117" />
    <title>Strata — Disk Usage Explorer</title>
    <!-- favicon: the Strata brand mark (same conic-gradient ring as .brand-mark) -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="favicon.svg" />
    <!-- social share preview (Open Graph + Twitter Card) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Strata" />
    <meta property="og:title" content="Strata — Disk Usage Explorer" />
    <meta
      property="og:description"
      content="Self-hosted disk usage explorer: interactive sunburst, trends, and snapshot comparisons."
    />
    <meta property="og:image" content="og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Strata — Disk Usage Explorer" />
    <meta
      name="twitter:description"
      content="Self-hosted disk usage explorer: interactive sunburst, trends, and snapshot comparisons."
    />
    <meta name="twitter:image" content="og-image.png" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <!-- atmospheric backdrop: dotted grid + soft accent glow -->
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="bg-glow" aria-hidden="true"></div>

    <!-- SPA mount point; app.js renders every route in here -->
    <div id="app">
      <div class="loading boot">
        <div class="spin"></div><span>Starting Strata…</span>
      </div>
    </div>

    <!-- D3 v7.9.0 full bundle (vendored, no CDN at runtime) -->
    <script src="vendor/d3.v7.min.js"></script>
    <!-- application scripts: order matters (plain globals, no modules) -->
    <script src="js/util.js"></script>
    <script src="js/stats.js"></script>
    <script src="js/sunburst.js"></script>
    <script src="js/trends.js"></script>
    <script src="js/compare.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
