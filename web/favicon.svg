  <rect x="8.7" y="8.7" width="14.6" height="14.6" rx="2.9" ry="2.9" fill="#0d1117"/>
  <!-- 1px border, mirrors box-shadow ring -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="8.7" ry="8.7" fill="none" stroke="#30363d" stroke-width="1"/>
</svg>
