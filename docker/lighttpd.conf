# Strata -- minimal lighttpd configuration.
# Serves the static SPA from the document root and runs *.cgi via mod_cgi.
# Runs as root (no privilege drop) so the API can cache sidecar files into the
# data volume; this is a single-purpose appliance container.

server.document-root = "/var/www/html"
server.port          = 8000
server.modules       = ("mod_access", "mod_cgi")
server.errorlog      = "/dev/stderr"

index-file.names = ("index.html")

# Never serve dotfiles or source/backup artifacts as static content, so a stray
# file under the doc root (editor swap, *.py helper, *.bak) can't leak as text.
$HTTP["url"] =~ "(?i)/\.|~$|\.(py|pyc|pyo|bak|swp)$" {
  url.access-deny = ("")
}

# Execute *.cgi only under /cgi-bin/ (via the file's shebang line); a .cgi file
# dropped anywhere else in the doc root is served, not run.
$HTTP["url"] =~ "^/cgi-bin/" {
  cgi.assign = (".cgi" => "")
}

mimetype.assign = (
  ".html" => "text/html; charset=utf-8",
  ".css"  => "text/css; charset=utf-8",
  ".js"   => "application/javascript; charset=utf-8",
  ".json" => "application/json",
  ".svg"  => "image/svg+xml",
  ".png"  => "image/png",
  ".ico"  => "image/x-icon"
)
