# DUC Advanced -- minimal lighttpd configuration.
# Serves the static SPA from the document root and runs *.cgi via mod_cgi.
# Runs as root (no privilege drop) so the API can cache sidecar files into the
# duc data volume; this is a single-purpose appliance container.

server.document-root = "/var/www/html"
server.port          = 8000
server.modules       = ("mod_cgi")
server.errorlog      = "/dev/stderr"

index-file.names = ("index.html")

# Empty interpreter => execute the .cgi file directly via its shebang line.
cgi.assign = (".cgi" => "")

mimetype.assign = (
  ".html" => "text/html; charset=utf-8",
  ".css"  => "text/css; charset=utf-8",
  ".js"   => "application/javascript; charset=utf-8",
  ".json" => "application/json",
  ".svg"  => "image/svg+xml",
  ".png"  => "image/png",
  ".ico"  => "image/x-icon"
)
