services:
  strata:
    # Pre-built image published by .github/workflows/build.yml.
    # To build locally instead, comment out `image:` and uncomment `build:`.
    image: ghcr.io/v3djg6gl/strata:latest
    # build: .
    container_name: strata
    environment:
      # Space-separated directories to scan. Each path must live inside one of
      # the volumes mounted below.
      STRATA_SCAN_PATHS: "/mnt/hdd-pool /mnt/ssd-pool"
      # Seconds between scans (86400 = once per day). Used when no schedule is
      # set below, and as the fallback if the schedule is invalid.
      STRATA_SCAN_INTERVAL: "86400"
      # Optional fixed schedule as a 5-field cron expression. When set it
      # overrides STRATA_SCAN_INTERVAL and fires at these wall-clock times,
      # DST-aware via TZ. Numeric fields only. Empty = use the interval.
      #   STRATA_SCAN_SCHEDULE: "0 20 * * *"   # every day at 20:00
      #   STRATA_SCAN_SCHEDULE: "0 3 * * 0"    # Sundays at 03:00
      STRATA_SCAN_SCHEDULE: ""
      # Timezone for the schedule and for timestamps (image bundles tzdata).
      TZ: "UTC"
      # Live progress %: "false" (default) estimates it from the previous
      # scan's file count (instant, no extra I/O). "true" instead pre-counts
      # every file on each scan for an exact %, at the cost of a full extra
      # metadata pass -- slow on large spinning-disk trees.
      STRATA_SCAN_PRECOUNT: "false"
      # Number of snapshots to retain; older ones are pruned automatically.
      STRATA_KEEP_SNAPSHOTS: "30"
      # How individual files are surfaced (as their own chart slices, browsable,
      # and in Compare). Directory totals and file COUNTS are always exact; these
      # only tune which files are stored individually. A file is kept if it is
      # among the STRATA_FILE_TOP biggest in its folder OR at least
      # STRATA_FILE_FLOOR bytes -- the two combine (union).
      #   STRATA_FILE_TOP   : how many of the biggest files per folder to keep
      #                       (default 12; 0 = none).
      #   STRATA_FILE_FLOOR : also store every file at least this big
      #                       (e.g. 100M, 1G; empty = off; 0 = every file).
      # Defaults reproduce the lean original behaviour. A very low or 0 floor on
      # a tree with millions of files is "DUC parity": it stores every file and
      # costs roughly +250 MB indexer RAM and +75 MB snapshot per 5M files (the
      # browsable list is also capped at 50,000 files/folder as a guard). Use a
      # non-zero floor on very large file-count trees.
      STRATA_FILE_TOP: "12"
      STRATA_FILE_FLOOR: ""
      # Testing/dev only. If truthy (1/true/yes/on), run a scan immediately on
      # every container start/restart, overriding the recent-snapshot deferral
      # (a normal start defers the first scan when a recent snapshot exists).
      # Leave empty for production.
      STRATA_SCAN_ON_START: ""
      # Optional hardlink attribution. A file with several hard links is
      # counted once -- under one chosen directory; links elsewhere are
      # reported as free copies. The "original" is chosen in priority order:
      #   1. a link inside a STRATA_HARDLINK_PRIORITY directory
      #   2. a link inside an unlisted directory
      #   3. a link inside a STRATA_HARDLINK_COPIES directory
      # One directory per line; leave both empty for first-link-seen.
      # Example:
      #   STRATA_HARDLINK_PRIORITY: |
      #     /mnt/ssd-pool/media
      #     /mnt/hdd-pool/archive
      #   STRATA_HARDLINK_COPIES: |
      #     /mnt/ssd-pool/downloads
      STRATA_HARDLINK_PRIORITY: ""
      STRATA_HARDLINK_COPIES: ""
    ports:
      - "8000:8000"
    volumes:
      # Read-only access to the data being measured.
      - /mnt:/mnt:ro
      # Persistent storage for snapshot databases and generated artifacts.
      - /mnt/ssd-pool/appdata/strata:/var/lib/strata
    restart: unless-stopped
    networks:
      - nginx_proxy

networks:
  nginx_proxy:
    external: true
